services:
  mysql:
    image: mysql:8.0
    container_name: coconexus-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: coconexus_db
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: coconexus-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: coconexus_db
      DB_TEST_NAME: coconexus_db_test
      DB_USER: root
      DB_PASSWORD: root
      DB_DIALECT: mysql
      JWT_SECRET: change-this-for-production
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:8080
      LOG_LEVEL: combined
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_NAME: COCONEXUS
    container_name: coconexus-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
