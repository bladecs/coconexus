<text x="20" y="930" font-size="10" fill="#7a7a76">Catatan: kolom status Article hanya memiliki 3 nilai (draft, revision, published) — tidak ada state "submitted"/"approved" terpisah pada basis data.</text>
<text x="20" y="946" font-size="10" fill="#7a7a76">Gerbang wajib: hanya Redaktur Publikasi (moderator, sub-tipe publication) yang dapat mengubah status artikel — Kurator Konten tidak memiliki akses untuk mempublikasikan artikelnya sendiri.</text>
